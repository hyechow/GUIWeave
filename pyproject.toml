[project]
name = "guiweave"
version = "0.1.0"
description = "Tool Agent Master runtime for local browser, Android, and iPhone automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.3",
    "httpx[socks]>=0.28.1",
    "langchain-openai>=1.1.13",
    "jsonschema>=4.26.0",
    "mcp>=1.27.0",
    "numpy>=1.14.5,<=2.3.5",
    "uvicorn>=0.44.0",
    "pillow>=12.2.0",
    "scikit-image>=0.26.0",
    "playwright>=1.60.0",
    "webarena-verified>=1.2.3",
    "adbutils>=2",
    "json-repair>=0.53.1",
    "pydantic>=2.12.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
    "websocket-client>=1.8.0",
]

[project.scripts]
guiweave = "gui_agent.cli:main"
guiweave-mcp = "gui_agent.mcp_server:main"
guiweave-console = "gui_agent.console:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gui_agent*", "llm*", "replay*"]

[tool.setuptools.package-data]
gui_agent = ["console_assets/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# Deterministic regression tests live in tests/ (evals are kept separate).
# pythonpath="." lets test modules import the repo-root `gui_agent` package.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
