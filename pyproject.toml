[project]
name = "guiweave"
version = "0.1.0"
description = "A programmable runtime for cross-platform GUI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.95.0",
    "coremltools>=9.0",
    "fastapi>=0.135.3",
    "httpx[socks]>=0.28.1",
    "huggingface-hub>=1.11.0",
    "langchain-anthropic>=1.4.0",
    "langchain-openai>=1.1.13",
    "jsonschema>=4.26.0",
    "langgraph>=1.1.6",
    "mcp>=1.27.0",
    "ocrmac>=1.0.1; sys_platform == 'darwin'",  # Apple Vision OCR — iPhone adapter only; unavailable on Linux
    "sse-starlette>=3.3.4",
    "ultralytics>=8.4.38",
    "torch>=2.7.0,<2.8.0",
    "numpy>=1.14.5,<=2.3.5",
    "uvicorn>=0.44.0",
    "pillow>=12.2.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.52",
    "langchain-qwq>=0.3.4",
    "pymobiledevice3>=9.12.0",
    "imagehash>=4.3.2",
    "scikit-image>=0.26.0",
    "transformers>=5.8.1",
    "sentence-transformers>=5.5.0",
    "onnxruntime",
    "onnx",
    "onnxslim",
    "playwright>=1.60.0",
    "webarena-verified>=1.2.3",
    "adbutils>=2",
    "pypdf>=6.13.2",
    "pymupdf>=1.27.2.3",
    "json-repair>=0.53.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# Deterministic regression tests live in tests/ (evals are kept separate).
# pythonpath="." lets test modules import the repo-root `gui_agent` package.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
